<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 공부와 운동</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #D6D6FF;
  color: #35358D;
}

header {
  height: 76px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 30px;
  background: white;
}

h1 { font-size: 25px; }

.cash-area {
  font-size: 22px;
  font-weight: bold;
}

main {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 20px;
}

.panel {
  background: white;
  border-radius: 20px;
  padding: 22px;
  position: relative;
  min-width: 0;
}

.panel h2 { margin-top: 0; }

.description {
  color: #9999BB;
  font-size: 13px;
  margin-bottom: 15px;
}

.canvas-wrap {
  width: 100%;
  height: 460px;
  background: #F7F7FF;
  border: 2px dashed #C6C6F0;
  border-radius: 15px;
  overflow: hidden;
}

#routeCanvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#cameraWrap {
  position: relative;
  width: 100%;
  height: 460px;
  background: #25253C;
  border-radius: 15px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

#cameraVideo, #poseCanvas {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

#poseCanvas { pointer-events: none; }

.camera-message {
  position: relative;
  z-index: 2;
  color: white;
  text-align: center;
  padding: 20px;
}

.hidden { display: none !important; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  background: #8888E8;
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #CCCCDD;
  cursor: not-allowed;
}

button.success { background: #64B99A; }
button.stop { background: #F08B9D; }
button.secondary { background: #AFAFEF; }

.stats {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  flex: 1;
  padding: 13px 5px;
  background: #F4F4FF;
  border-radius: 12px;
  text-align: center;
  min-width: 0;
}

.stat span {
  font-size: 12px;
  color: #8888AA;
}

.stat strong {
  display: block;
  font-size: 19px;
  margin-top: 7px;
}

.status {
  margin-top: 15px;
  padding: 13px;
  border-radius: 10px;
  background: #F3F3FF;
  font-size: 14px;
}

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #35355D99;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  border-radius: 20px;
}

.overlay.show { display: flex; }

.popup {
  background: white;
  border-radius: 22px;
  width: min(350px, 100%);
  padding: 25px;
  text-align: center;
}

.popup h2 { margin: 10px 0; }

.reward-coin {
  font-size: 60px;
}

@media(max-width:850px) {
  main { grid-template-columns: 1fr; }
  .canvas-wrap, #cameraWrap { height: 380px; }
}
</style>
</head>

<body>

<header>
  <h1>🌟 오늘의 공부와 운동</h1>
  <div class="cash-area">
    🪙 <span id="totalCash">0.00원</span>
  </div>
</header>

<main>

<section class="panel" id="studyPanel">

<h2>📚 가상 공부 루트</h2>

<div class="description">
나만의 루트를 그리고 캐릭터와 함께 이동해 보세요!
</div>

<div class="canvas-wrap">
  <canvas id="routeCanvas"></canvas>
</div>

<div class="controls">

  <button id="drawBtn">
    ✏️ 루트 그리기
  </button>

  <button id="completeBtn" disabled>
    ✓ 완료
  </button>

  <button id="startStudyBtn" class="success" disabled>
    📖 공부하기
  </button>

  <button id="stopStudyBtn" class="stop" disabled>
    공부 완료
  </button>

  <button id="resetBtn" class="secondary">
    다시 그리기
  </button>

</div>

<div class="stats">

  <div class="stat">
    <span>공부 시간</span>
    <strong id="studyTime">00:00</strong>
  </div>

  <div class="stat">
    <span>이동 거리</span>
    <strong id="studyDistance">0.0000m</strong>
  </div>

  <div class="stat">
    <span>예상 캐시</span>
    <strong id="studyCash">0.00원</strong>
  </div>

</div>

<div class="status" id="studyStatus">
  먼저 루트를 그려 주세요!
</div>

<div class="overlay" id="studyOverlay">
  <div class="popup" id="studyPopup"></div>
</div>

</section>


<section class="panel">

<h2>🏃 모션 캡처 운동</h2>

<div class="description">
카메라로 나의 움직임을 인식하고 운동 시간을 기록해 보세요!
</div>

<div id="cameraWrap">

  <video id="cameraVideo" autoplay playsinline muted></video>

  <canvas id="poseCanvas"></canvas>

  <div class="camera-message" id="cameraMessage">
    📷<br><br>
    운동을 시작하려면<br>
    아래 운동하기 버튼을 눌러 주세요!
  </div>

</div>

<div class="controls">

  <button id="startExerciseBtn" class="success">
    🏃 운동하기
  </button>

  <button id="stopExerciseBtn" class="stop" disabled>
    운동 그만하기
  </button>

</div>

<div class="stats">

  <div class="stat">
    <span>운동 시간</span>
    <strong id="exerciseTime">00:00</strong>
  </div>

  <div class="stat">
    <span>획득 캐시</span>
    <strong id="exerciseCash">0.00원</strong>
  </div>

</div>

<div class="status" id="exerciseStatus">
  아직 운동을 시작하지 않았어요!
</div>

<div class="overlay" id="exerciseOverlay">
  <div class="popup" id="exercisePopup"></div>
</div>

</section>

</main>


<script type="module">

// ===================================
// 1. MediaPipe 불러오기
// ===================================

import {
  FilesetResolver,
  PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";


// ===================================
// 2. 기본 설정
// ===================================

const canvas = document.getElementById("routeCanvas");
const ctx = canvas.getContext("2d");

let points = [];
let routeLength = 0;

let drawing = false;
let drawingEnabled = false;
let routeCompleted = false;

let studyRunning = false;
let studyFinished = false;

let studyStartTime = 0;
let studyElapsed = 0;
let studyTimer = null;

let exerciseRunning = false;
let exerciseStartTime = 0;
let exerciseElapsed = 0;
let exerciseTimer = null;

let cameraStream = null;
let poseLandmarker = null;
let lastVideoTime = -1;

let totalCash =
  Number(localStorage.getItem("studyExerciseCash")) || 0;


// 이전에 저장된 캐릭터 이미지 삭제
localStorage.removeItem("customCharacter");


// ===================================
// 3. 캐시 저장
// ===================================

function saveCash() {

  localStorage.setItem(
    "studyExerciseCash",
    String(totalCash)
  );

  document.getElementById("totalCash").textContent =
    totalCash.toFixed(2) + "원";
}

function addCash(amount) {

  totalCash += amount;
  saveCash();
}

saveCash();


// ===================================
// 4. 시간 표시
// ===================================

function formatTime(seconds) {

  seconds = Math.floor(seconds);

  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;

  return String(minutes).padStart(2, "0")
    + ":" +
    String(secs).padStart(2, "0");
}


// ===================================
// 5. 캔버스 크기
// ===================================

function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  renderRoute();
}

window.addEventListener("resize", resizeCanvas);


// ===================================
// 6. 마우스 위치
// ===================================

function getPosition(event) {

  const rect = canvas.getBoundingClientRect();

  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}


// ===================================
// 7. 루트 그리기 버튼
// ===================================

document.getElementById("drawBtn").onclick = () => {

  if (studyRunning || studyFinished) return;

  points = [];
  routeLength = 0;

  drawingEnabled = true;
  routeCompleted = false;

  document.getElementById("drawBtn").disabled = true;
  document.getElementById("completeBtn").disabled = true;
  document.getElementById("startStudyBtn").disabled = true;
  document.getElementById("stopStudyBtn").disabled = true;

  document.getElementById("studyStatus").textContent =
    "원하는 루트를 자유롭게 그려 주세요!";

  renderRoute();
};


// ===================================
// 8. 펜 기능
// ===================================

canvas.addEventListener("pointerdown", event => {

  if (!drawingEnabled) return;

  drawing = true;

  canvas.setPointerCapture(event.pointerId);

  points.push(getPosition(event));

  renderRoute();
});

canvas.addEventListener("pointermove", event => {

  if (!drawing || !drawingEnabled) return;

  points.push(getPosition(event));

  renderRoute();
});

canvas.addEventListener("pointerup", () => {

  drawing = false;

  if (points.length > 1) {
    document.getElementById("completeBtn").disabled = false;
  }
});

canvas.addEventListener("pointercancel", () => {
  drawing = false;
});


// ===================================
// 9. 루트 길이 계산
// ===================================

function calculateRouteLength() {

  let length = 0;

  for (let i = 1; i < points.length; i++) {

    const dx = points[i].x - points[i - 1].x;
    const dy = points[i].y - points[i - 1].y;

    length += Math.sqrt(dx * dx + dy * dy);
  }

  return length;
}


// ===================================
// 10. 캐릭터 이동 위치 계산
// ===================================

function getCharacterPosition(distance) {

  if (points.length === 0) return null;

  let remaining = Math.min(distance, routeLength);

  for (let i = 1; i < points.length; i++) {

    const p1 = points[i - 1];
    const p2 = points[i];

    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;

    const segment = Math.sqrt(dx * dx + dy * dy);

    if (remaining <= segment) {

      const ratio = segment === 0 ? 0 : remaining / segment;

      return {
        x: p1.x + dx * ratio,
        y: p1.y + dy * ratio
      };
    }

    remaining -= segment;
  }

  return points[points.length - 1];
}


// ===================================
// 11. 실제 이동 거리 계산
// ===================================

function getMovedMeters() {

  // 실제 이동 거리: 1초당 0.1m
  return studyElapsed * 0.1;
}


// ===================================
// 12. 화면 속 캐릭터 이동 속도
// ===================================

function getVisualMovedPixels() {

  // 화면에서 초당 100px 이동
  return studyElapsed * 100;
}


// ===================================
// 13. 화면 그리기
// ===================================

function renderRoute() {

  const rect = canvas.getBoundingClientRect();

  ctx.clearRect(0, 0, rect.width, rect.height);

  ctx.fillStyle = "#F7F7FF";
  ctx.fillRect(0, 0, rect.width, rect.height);

  if (points.length > 0) {

    // 루트 선

    ctx.beginPath();

    ctx.moveTo(points[0].x, points[0].y);

    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }

    ctx.strokeStyle = "#9999EE";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.stroke();

    // 출발점

    ctx.beginPath();

    ctx.arc(
      points[0].x,
      points[0].y,
      7,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#64CC91";
    ctx.fill();

    // 도착점

    const last = points[points.length - 1];

    ctx.beginPath();

    ctx.arc(
      last.x,
      last.y,
      7,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#F08B9D";
    ctx.fill();
  }

  // 캐릭터 표시

  if (routeCompleted && points.length > 0) {

    let visualMoved = 0;

    if (studyRunning || studyFinished) {
      visualMoved = getVisualMovedPixels();
    }

    // 루트 끝에 도착하면 출발점부터 반복 이동

    const routeProgress = routeLength > 0
      ? visualMoved % routeLength
      : 0;

    const pos = getCharacterPosition(routeProgress);

    if (pos) {

      ctx.font = "36px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // 사진 대신 이모지 캐릭터 사용

      ctx.fillText("🚶", pos.x, pos.y);
    }
  }
}


// ===================================
// 14. 루트 완료 버튼
// ===================================

document.getElementById("completeBtn").onclick = () => {

  if (points.length < 2) return;

  drawingEnabled = false;
  drawing = false;

  routeCompleted = true;

  routeLength = calculateRouteLength();

  document.getElementById("drawBtn").disabled = true;
  document.getElementById("completeBtn").disabled = true;

  document.getElementById("startStudyBtn").disabled = false;

  document.getElementById("studyStatus").textContent =
    "루트 완성! 출발점에 캐릭터가 나타났어요. 공부를 시작해 보세요!";

  renderRoute();
};


// ===================================
// 15. 공부하기 버튼
// ===================================

document.getElementById("startStudyBtn").onclick = () => {

  if (!routeCompleted || studyRunning || studyFinished) return;

  studyRunning = true;

  studyElapsed = 0;
  studyStartTime = Date.now();

  document.getElementById("startStudyBtn").disabled = true;
  document.getElementById("stopStudyBtn").disabled = false;
  document.getElementById("resetBtn").disabled = true;

  document.getElementById("studyStatus").textContent =
    "공부 중이에요! 캐릭터가 루트를 따라 이동하고 있어요!";

  studyTimer = setInterval(updateStudy, 100);

  requestAnimationFrame(animateStudyRoute);
};


// 캐릭터를 부드럽게 움직이는 애니메이션

function animateStudyRoute() {

  if (!studyRunning) return;

  renderRoute();

  requestAnimationFrame(animateStudyRoute);
}


// ===================================
// 16. 공부 시간 및 거리 갱신
// ===================================

function updateStudy() {

  studyElapsed = (Date.now() - studyStartTime) / 1000;

  const movedMeters = getMovedMeters();

  const earned = studyElapsed / 60;

  document.getElementById("studyTime").textContent =
    formatTime(studyElapsed);

  document.getElementById("studyDistance").textContent =
    movedMeters.toFixed(6) + "m";

  document.getElementById("studyCash").textContent =
    earned.toFixed(2) + "원";

  renderRoute();
}


// ===================================
// 17. 공부 완료 버튼
// ===================================

document.getElementById("stopStudyBtn").onclick = () => {

  if (!studyRunning) return;

  clearInterval(studyTimer);

  updateStudy();

  studyRunning = false;
  studyFinished = true;

  const earned = studyElapsed / 60;
  const movedMeters = getMovedMeters();

  document.getElementById("stopStudyBtn").disabled = true;
  document.getElementById("startStudyBtn").disabled = true;

  document.getElementById("studyStatus").textContent =
    "공부를 완료했어요!";

  document.getElementById("studyPopup").innerHTML = `

    <div class="reward-coin">🚶</div>

    <h2>공부 완료!</h2>

    <p>오늘도 고생 많았어! 💜</p>

    <p>
      오늘의 공부거리<br>
      <strong>${movedMeters.toFixed(4)}m</strong>
    </p>

    <button id="closeStudyMessage">확인</button>
  `;

  document.getElementById("studyOverlay").classList.add("show");

  document.getElementById("closeStudyMessage").onclick = () => {

    addCash(earned);

    document.getElementById("studyPopup").innerHTML = `

      <div class="reward-coin">🪙</div>

      <h2>캐시 획득!</h2>

      <p>열심히 공부한 보상이야!</p>

      <h2 style="color:#D6A52C">
        +${earned.toFixed(2)}원
      </h2>

      <button id="finishStudyReward">확인</button>
    `;

    document.getElementById("finishStudyReward").onclick = () => {

      document.getElementById("studyOverlay").classList.remove("show");

      studyFinished = false;
      studyRunning = false;
      drawingEnabled = false;

      // 모든 버튼 다시 활성화

      document.getElementById("drawBtn").disabled = false;
      document.getElementById("completeBtn").disabled = false;
      document.getElementById("startStudyBtn").disabled = false;
      document.getElementById("stopStudyBtn").disabled = false;
      document.getElementById("resetBtn").disabled = false;

      document.getElementById("studyStatus").textContent =
        "공부 완료! 새로운 루트를 그리거나 다시 공부해 보세요!";

      renderRoute();
    };
  };

  renderRoute();
};


// ===================================
// 18. 루트 다시 그리기
// ===================================

document.getElementById("resetBtn").onclick = () => {

  if (studyRunning || studyFinished) return;

  points = [];
  routeLength = 0;

  routeCompleted = false;
  drawingEnabled = false;

  document.getElementById("drawBtn").disabled = false;
  document.getElementById("completeBtn").disabled = true;
  document.getElementById("startStudyBtn").disabled = true;
  document.getElementById("stopStudyBtn").disabled = true;

  document.getElementById("studyTime").textContent = "00:00";
  document.getElementById("studyDistance").textContent = "0.0000m";
  document.getElementById("studyCash").textContent = "0.00원";

  document.getElementById("studyStatus").textContent =
    "새로운 루트를 그려 주세요!";

  renderRoute();
};


// ===================================
// 19. MediaPipe 모델 준비
// ===================================

async function loadPoseModel() {

  if (poseLandmarker) return;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(
    vision,
    {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate: "GPU"
      },

      runningMode: "VIDEO",
      numPoses: 1
    }
  );
}


// ===================================
// 20. 운동하기 버튼
// ===================================

document.getElementById("startExerciseBtn").onclick = async () => {

  if (exerciseRunning) return;

  try {

    document.getElementById("exerciseStatus").textContent =
      "카메라 권한을 요청하고 있어요!";

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    const video = document.getElementById("cameraVideo");

    video.srcObject = cameraStream;

    await video.play();

    await loadPoseModel();

    exerciseRunning = true;

    exerciseElapsed = 0;
    exerciseStartTime = Date.now();

    document.getElementById("cameraMessage").classList.add("hidden");

    document.getElementById("startExerciseBtn").disabled = true;
    document.getElementById("stopExerciseBtn").disabled = false;

    document.getElementById("exerciseStatus").textContent =
      "모션 인식 중! 열심히 운동해 봐요!";

    exerciseTimer = setInterval(updateExercise, 100);

    requestAnimationFrame(detectPose);

  } catch (error) {

    console.error(error);

    if (cameraStream) {

      cameraStream.getTracks().forEach(track => track.stop());

      cameraStream = null;
    }

    document.getElementById("cameraVideo").srcObject = null;

    document.getElementById("cameraMessage").classList.remove("hidden");

    document.getElementById("cameraMessage").innerHTML =
      "화면을 켜주세요!<br>우리 같이 공부해야죠!";

    document.getElementById("exerciseStatus").textContent =
      "카메라 권한을 허용해야 해요.";
  }
};


// ===================================
// 21. 모션 인식
// ===================================

function detectPose() {

  if (!exerciseRunning) return;

  const video = document.getElementById("cameraVideo");
  const poseCanvas = document.getElementById("poseCanvas");
  const poseCtx = poseCanvas.getContext("2d");

  if (video.readyState >= 2 && poseLandmarker) {

    if (video.currentTime !== lastVideoTime) {

      lastVideoTime = video.currentTime;

      const result = poseLandmarker.detectForVideo(
        video,
        performance.now()
      );

      poseCanvas.width = video.videoWidth;
      poseCanvas.height = video.videoHeight;

      poseCtx.clearRect(
        0, 0,
        poseCanvas.width,
        poseCanvas.height
      );

      if (result.landmarks && result.landmarks.length > 0) {

        const landmarks = result.landmarks[0];

        poseCtx.strokeStyle = "#8EFFC1";
        poseCtx.lineWidth = 3;

        for (const connection of PoseLandmarker.POSE_CONNECTIONS) {

          const start = landmarks[connection.start];
          const end = landmarks[connection.end];

          if (
            (start.visibility ?? 1) < 0.4 ||
            (end.visibility ?? 1) < 0.4
          ) continue;

          poseCtx.beginPath();

          poseCtx.moveTo(
            start.x * poseCanvas.width,
            start.y * poseCanvas.height
          );

          poseCtx.lineTo(
            end.x * poseCanvas.width,
            end.y * poseCanvas.height
          );

          poseCtx.stroke();
        }

        for (const point of landmarks) {

          if ((point.visibility ?? 1) < 0.4) continue;

          poseCtx.beginPath();

          poseCtx.arc(
            point.x * poseCanvas.width,
            point.y * poseCanvas.height,
            4,
            0,
            Math.PI * 2
          );

          poseCtx.fillStyle = "#FFFFFF";
          poseCtx.fill();
        }
      }
    }
  }

  requestAnimationFrame(detectPose);
}


// ===================================
// 22. 운동 시간 계산
// ===================================

function updateExercise() {

  exerciseElapsed = Math.floor(
    (Date.now() - exerciseStartTime) / 1000
  );

  const earned = exerciseElapsed / 60;

  document.getElementById("exerciseTime").textContent =
    formatTime(exerciseElapsed);

  document.getElementById("exerciseCash").textContent =
    earned.toFixed(2) + "원";
}


// ===================================
// 23. 운동 그만하기
// ===================================

document.getElementById("stopExerciseBtn").onclick = () => {

  if (!exerciseRunning) return;

  clearInterval(exerciseTimer);

  updateExercise();

  exerciseRunning = false;

  const earned = exerciseElapsed / 60;

  if (cameraStream) {

    cameraStream.getTracks().forEach(track => track.stop());

    cameraStream = null;
  }

  document.getElementById("cameraVideo").srcObject = null;

  const poseCanvas = document.getElementById("poseCanvas");

  poseCanvas.getContext("2d").clearRect(
    0, 0,
    poseCanvas.width,
    poseCanvas.height
  );

  document.getElementById("cameraMessage").classList.remove("hidden");

  document.getElementById("cameraMessage").innerHTML =
    "오늘의 운동이 끝났어요! 💜";

  document.getElementById("startExerciseBtn").disabled = false;
  document.getElementById("stopExerciseBtn").disabled = true;

  document.getElementById("exerciseStatus").textContent =
    "오늘도 정말 수고했어요!";

  document.getElementById("exercisePopup").innerHTML = `

    <div class="reward-coin">🚶</div>

    <h2>오늘도 정말 열심히 운동했네요!</h2>

    <p>내일 또 봐요! 💜</p>

    <p>
      오늘 운동 시간<br>
      <strong>${formatTime(exerciseElapsed)}</strong>
    </p>

    <button id="closeExerciseMessage">확인</button>
  `;

  document.getElementById("exerciseOverlay").classList.add("show");

  document.getElementById("closeExerciseMessage").onclick = () => {

    addCash(earned);

    document.getElementById("exercisePopup").innerHTML = `

      <div class="reward-coin">🪙</div>

      <h2>캐시 획득!</h2>

      <p>오늘도 정말 고생했어요!</p>

      <h2 style="color:#D6A52C">
        +${earned.toFixed(2)}원
      </h2>

      <button id="finishExerciseReward">확인</button>
    `;

    document.getElementById("finishExerciseReward").onclick = () => {

      document.getElementById("exerciseOverlay").classList.remove("show");
    };
  };
};


// ===================================
// 24. 최초 실행
// ===================================

resizeCanvas();

</script>
